services:
  mongodb:
    image: mongo:6
    container_name: awdf-mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: awdf-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/awdf_docker
    ports:
      - "5004:5004"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: awdf-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
