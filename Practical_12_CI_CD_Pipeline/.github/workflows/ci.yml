name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practical_12_CI_CD_Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Practical_12_CI_CD_Pipeline/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practical_12_CI_CD_Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Practical_12_CI_CD_Pipeline/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --verbose

  pipeline-status:
    name: Pipeline gate
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All green
        run: echo "lint + test passed; pipeline is green ✅"
